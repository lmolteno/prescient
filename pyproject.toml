[project]
name = "prescient"
version = "0.1.0"
description = "Space-weather data service: ingests NOAA SWPC solar regions/events and Stanford SDO/HMI sunspot contours, served over an HTTP API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "tenacity>=9.0",
    "structlog>=24.4",
    "opencv-python-headless>=4.10",
    "numpy>=2.1",
]

[project.scripts]
prescient-api = "prescient.api.__main__:main"
prescient-poller = "prescient.poller.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prescient"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
